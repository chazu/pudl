# Git hooks managed by lefthook (https://lefthook.dev).
#
# Setup (once per clone):
#   brew install lefthook gitleaks
#   cargo install ratchets       # https://github.com/imbue-ai/ratchets
#   lefthook install
pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      # Scan only the staged changes for secrets.
      run: gitleaks git --pre-commit --staged --redact --no-banner
    - name: ratchets
      # Budgets in ratchet-counts.toml are whole-repo counts, so check the
      # whole repo rather than only staged files.
      run: ratchets check
pre-push:
  jobs:
    - name: push-scan
      # Block commits that name operational details (orgs, repos, projects,
      # stacks) from the local term file. A script, not `run`: lefthook skips
      # a pre-push `run` job when it finds no push files (a new branch, say),
      # and this scan must never be skipped.
      script: push-scan.sh
      runner: sh
      use_stdin: true
